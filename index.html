<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse builder</title>
<style>
  :root{--paper:#f4f2ec;--panel:#fbfaf6;--ink:#231e16;--muted:#7d766a;--rule:#dcd6ca;--accent:#2f7de1;--danger:#c8382e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{display:grid;grid-template-columns:200px 1fr 250px;grid-template-rows:auto 1fr auto;height:100%}
  header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:14px;margin:0 12px 0 0;letter-spacing:.01em}
  header .sp{flex:1}
  button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#b9b1a2;background:#fdfcf9}
  button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  button.danger{color:var(--danger)}
  aside{background:var(--panel);overflow:auto;padding:10px}
  aside.left{border-right:1px solid var(--rule)} aside.right{border-left:1px solid var(--rule)}
  aside h2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
  aside h2:first-child{margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .grid2 button{text-align:left;padding:6px 8px;font-size:12px}
  .grid2 button.wide{grid-column:1/-1}
  .tool{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
  .tool small{color:var(--muted);font-size:10.5px} button.on small{color:#cfd7e6}
  #view{position:relative;overflow:hidden;min-width:0;min-height:0}
  #view canvas{display:block;touch-action:none}
  .labels{position:absolute;inset:0;pointer-events:none}
  .ltag{pointer-events:auto;cursor:pointer;font:700 10.5px/1 ui-monospace,Menlo,monospace;background:#fff;color:#2b4fb8;border:1.5px solid #3f5fc9;border-radius:6px;padding:3px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sizetag{font:600 12px/1 ui-monospace,Menlo,monospace;background:var(--ink);color:#fff;border-radius:6px;padding:4px 7px;white-space:nowrap}
  footer{grid-column:1/-1;padding:6px 12px;border-top:1px solid var(--rule);background:var(--panel);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #panel h3{margin:2px 0 10px;font-size:14px}
  .f{display:flex;flex-direction:column;gap:3px;margin:0 0 8px}
  .f span{font-size:11px;color:var(--muted)}
  .f input,.f select{font:inherit;padding:5px 7px;border:1px solid var(--rule);border-radius:7px;background:#fff;width:100%}
  #panel button{width:100%;margin:4px 0}
  .kv{margin:4px 0;color:#4a443a} .note{color:var(--muted);font-size:11.5px;margin:6px 0}
  #empty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;text-align:center;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  #empty h2{margin:0 0 6px;font-size:16px} #empty p{margin:0 0 12px;color:var(--muted)}
  #empty button{background:var(--ink);color:#fff;border-color:var(--ink);padding:7px 14px}
  #toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);background:#fff1bf;border:1px solid rgba(35,30,22,.25);border-radius:8px;padding:7px 12px;font-weight:600;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:5;max-width:80%}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loggercard{position:absolute;left:0;top:0;width:220px;background:#fff;border:1.5px solid #3f5fc9;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(20,30,60,.18);z-index:4}
  #loggercard .ch{display:flex;justify-content:space-between;align-items:center}
  #loggercard .lname{font:800 18px ui-monospace,Menlo,monospace;color:#2b4fb8}
  #loggercard .x{border:0;background:none;font-size:18px;padding:0 4px;width:auto}
  #loggercard .temp{font:800 34px/1.1 ui-monospace,Menlo,monospace;margin:4px 0}
  #loggercard .temp small{font-size:14px;margin-left:2px}
  #loggercard button{width:100%;margin-top:4px}
  @media (max-width:860px){.app{grid-template-columns:160px 1fr}.right{display:none}}
  @media (max-width:600px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}aside.left{max-height:150px;border-right:0;border-bottom:1px solid var(--rule)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <header>
    <h1>Warehouse builder</h1>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sp"></span>
    <button id="wallmode">Walls: see-through</button><button id="tags" class="on">Logger tags</button><button id="fit">Fit view</button>
    <button id="example">Example</button><button id="new">New</button><button id="import">Import</button><button id="export">Export</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>
  <aside class="left">
    <h2>Tools</h2>
    <div class="grid2">
      <button data-mode="select" class="tool">Select<small>V</small></button>
      <button data-mode="logger" class="tool">Place logger<small>L · click a rack</small></button>
      <button data-mode="floor" class="tool">Floor<small>F · drag</small></button>
      <button data-mode="wall" class="tool">Wall<small>W · drag</small></button>
    </div>
    <h2>Storage</h2>
    <div class="grid2"><button data-mode="place" data-kind="rack" class="wide">Pallet rack</button></div>
    <h2>Doors</h2>
    <div class="grid2">
      <button data-mode="place" data-kind="door:swing" class="wide">Door</button>
      <button data-mode="place" data-kind="door:hslide" class="wide">Sliding door (horizontal)</button>
      <button data-mode="place" data-kind="door:vslide" class="wide">Roller door (vertical)</button>
    </div>
    <h2>Loads</h2>
    <div class="grid2">
      <button data-mode="place" data-kind="item:carton">Cartons</button>
      <button data-mode="place" data-kind="item:sack">Sacks</button>
      <button data-mode="place" data-kind="item:drum">Drums</button>
      <button data-mode="place" data-kind="item:tote">Totes</button>
      <button data-mode="place" data-kind="item:crate">Crate</button>
      <button data-mode="place" data-kind="item:mesh">Mesh box</button>
      <button data-mode="place" data-kind="item:pallet" class="wide">Empty pallet</button>
    </div>
    <h2>Monitoring</h2>
    <div class="grid2"><button data-mode="logger" class="wide">Data logger (RC-5)</button></div>
  </aside>
  <main id="view">
    <div id="empty"><h2>An empty space</h2><p>Start by drawing a floor, then add walls, racks, doors, loads and data loggers.</p><button id="start">Draw a floor</button></div>
    <div id="toast" role="status"></div>
    <div id="loggercard" hidden></div>
  </main>
  <aside class="right"><div id="panel"></div></aside>
  <footer id="hint"></footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
